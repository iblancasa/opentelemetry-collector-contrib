description: Config defines user-specified configurations unique to the Tencent Cloud CVM detector.
type: object
properties:
  fail_on_missing_metadata:
    description: FailOnMissingMetadata, if true, causes the detector to return an error when the Tencent Cloud CVM metadata service is unavailable or any required field is missing. If false (default), the detector logs the failure and returns an empty resource (no attributes set).
    type: boolean
  resource_attributes:
    description: ResourceAttributes controls which standard resource attributes are enabled (e.g., host.id, host.name, cloud.provider, etc.).
    x-customType: ./internal/metadata.resource_attributes_config
additionalProperties: false
